name: Source and media checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows / Python 3.12 / no model downloads
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.11.16'
          python-version: '3.12'
          enable-cache: true
      - name: Prepare FFmpeg
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --no-progress --yes
            if ($LASTEXITCODE -ne 0) { throw 'FFmpeg installation failed' }
          }
          ffmpeg -version
          ffprobe -version
      - name: Install application and test dependencies
        run: uv sync --locked --group dev
      - name: Validate publication contents and JavaScript
        run: |
          uv run --no-sync python scripts/check_repository.py
          node --check app/static/app.js
          node --check app/static/i18n.js
          node --check app/static/workspace.js
          node --check app/static/novels.js
          node --check app/static/recorder.js
          node tests/check_i18n.cjs
      - name: Run CPU and real-media regression tests
        run: uv run --no-sync pytest -q
